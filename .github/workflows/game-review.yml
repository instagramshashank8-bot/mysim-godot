          NATIVE_TRAFFIC_LAP: ${{ (inputs.depth == 'native_traffic_lap' || (inputs.depth == 'native_traffic_diagnostic' || inputs.depth == 'native_ccd_diagnostic')) && '1' || '0' }}
          NATIVE_AI_LAP: ${{ ((inputs.depth == 'native_traffic_lap' || (inputs.depth == 'native_traffic_diagnostic' || inputs.depth == 'native_ccd_diagnostic')) || inputs.depth == 'native_ai_lap' || (inputs.depth == 'native_hull_ai_lap' || inputs.depth == 'native_gt_pit_diagnostic')) && '1' || '0' }}
          NATIVE_HULL_RECOVERY: ${{ inputs.depth == 'native_hull_recovery' && '1' || '0' }}
