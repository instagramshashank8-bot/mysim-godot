          NATIVE_RACES: ${{ inputs.depth == 'native_races' && '1' || '0' }}
          CAR_UV_REVIEW: ${{ inputs.depth == 'car_uv' && '1' || '0' }}
          INPUT_PHYSICS: ${{ inputs.depth == 'input_physics' && '1' || '0' }}
          CAR_MATERIAL_REVIEW: ${{ inputs.depth == 'car_materials' && '1' || '0' }}
          COLLISION_PROBE: ${{ inputs.depth == 'collision_probe' && '1' || '0' }}
          SURFACE_REVIEW: ${{ inputs.depth == 'surfaces' && '1' || '0' }}
          FULL_RACES: ${{ inputs.depth == 'full_races' && '1' || '0' }}
        run: xvfb-run -a python tools/cloud_game_audit.py
      - name: Hash produced frames for the D0 identity check (unencrypted; hashes expose no render content)
        if: always()
        run: |
          f=outputs/cloud-game/frame-hashes.log
          find outputs/cloud-game -maxdepth 1 -name '*.png' -type f -exec sha256sum {} + | sort > "$f" || true
          wc -l "$f" || true
      - name: Preserve encrypted visual evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MYSIM_INTAKE_KEY: ${{ secrets.MYSIM_REVIEW_KEY || secrets.MYSIM_INTAKE_KEY }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -d outputs/cloud-game ]; then
            python tools/cloud_encrypt_output.py outputs/cloud-game "/tmp/game-review-${{ github.run_id }}-${{ github.run_attempt }}-$SHARD.enc"
            python tools/cloud_publish_review.py "/tmp/game-review-${{ github.run_id }}-${{ github.run_attempt }}-$SHARD.enc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-review-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: /tmp/game-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.enc
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-runtime-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            outputs/cloud-game/*.json
            outputs/cloud-game/*.jsonl
            outputs/cloud-game/*.log
            import.log
            vulkaninfo.log
          retention-days: 14
