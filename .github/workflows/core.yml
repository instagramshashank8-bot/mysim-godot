name: core-checks
on: { push: { branches: [main] }, workflow_dispatch: {} }
defaults:
  run:
    shell: bash
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: python tools/check_candidate_selection.py
      - run: python tools/check_environment_profiles.py
      - run: dotnet run --project tools/CoreRunner | tee core.txt
      - run: grep -qE "^PASS [0-9]+ assertions" core.txt && ! grep -q "^FAIL" core.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-result
          path: |
            core.txt
